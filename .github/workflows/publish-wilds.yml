name: Publish Wilds packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  certify-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout Wilds
        uses: actions/checkout@v4
        with:
          path: WildsEngine

      - name: Checkout QSL dependency
        uses: actions/checkout@v4
        with:
          repository: 5lsjeremy/QSL
          path: QSL

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore certification project
        working-directory: WildsEngine
        run: dotnet restore .\WildsEngine.Core.Tests\WildsEngine.Core.Tests.csproj

      - name: Certify Wilds Release
        working-directory: WildsEngine
        run: dotnet test .\WildsEngine.Core.Tests\WildsEngine.Core.Tests.csproj -c Release --no-restore

      - name: Pack WildsEngine.Core
        working-directory: WildsEngine
        run: dotnet pack .\WildsEngine.Core\WildsEngine.Core.csproj -c Release --no-restore -o .\artifacts\packages

      - name: Pack WildsEngine.Discoveries
        working-directory: WildsEngine
        run: dotnet pack .\WildsEngine.Discoveries\WildsEngine.Discoveries.csproj -c Release --no-restore -o .\artifacts\packages

      - name: Pack WildsEngine.Qsl
        working-directory: WildsEngine
        run: dotnet pack .\WildsEngine.Qsl\WildsEngine.Qsl.csproj -c Release --no-restore -o .\artifacts\packages

      - name: Add GitHub Packages source
        run: >-
          dotnet nuget add source
          --username $env:GITHUB_ACTOR
          --password $env:GITHUB_TOKEN
          --store-password-in-clear-text
          --name github
          "https://nuget.pkg.github.com/5lsjeremy/index.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Wilds packages
        working-directory: WildsEngine
        run: >-
          dotnet nuget push ".\artifacts\packages\*.nupkg"
          --source github
          --api-key $env:GITHUB_TOKEN
          --skip-duplicate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
